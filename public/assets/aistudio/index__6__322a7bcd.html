/* ===== Built-in base + utilities (no external CSS framework needed) ===== */

@media (min-width:640px){ .sm\:grid-cols-2{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (min-width:768px){
  .md\:flex-row{ flex-direction:row; } .md\:p-6{ padding:1.5rem; } .md\:px-6{ padding-left:1.5rem; padding-right:1.5rem; }
  .md\:px-8{ padding-left:2rem; padding-right:2rem; } .md\:py-12{ padding-top:3rem; padding-bottom:3rem; }
  .md\:text-4xl{ font-size:2.25rem; line-height:2.5rem; } .md\:text-base{ font-size:1rem; line-height:1.5rem; }
}
/* ===== end built-in utilities ===== */
  :root{
    --bg:#141414; --s1:#1a1a1a; --s2:#202020; --s3:#2a2a2a; --s4:#343434;
    --line:#2c2c2c; --fg:#ececec; --sub:#a8a8a8; --mute:#6f6f6f; --acc:#d6d6d6; --acc-ink:#141414;
    --tile:180px;
  }
  *{ -webkit-tap-highlight-color:transparent; scrollbar-width:thin; scrollbar-color:#3a3a3a transparent; }
  html,body{ touch-action:pan-x pan-y; height:100%; background:var(--bg); color:var(--fg); color-scheme:dark; overscroll-behavior:none; }
  body{ font-family:"Inter",ui-sans-serif,system-ui,sans-serif; }
  [hidden]{ display:none !important; }
  button{ cursor:pointer; font:inherit; color:inherit; background:none; border:0; }
  button:disabled{ cursor:default; }
  input,select{ font:inherit; color:inherit; }
  *,*::before,*::after{ user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  input,textarea{ user-select:text; -webkit-user-select:text; }
  img{ -webkit-user-drag:none; }
  ::selection{ background:transparent; }
  input::selection{ background:#d6d6d6; color:#141414; }
  :focus-visible{ outline:2px solid var(--acc); outline-offset:2px; }

  .ic{ width:1.25rem; height:1.25rem; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  /* Buttons */
  .btn-icon{ display:grid; place-items:center; width:2.5rem; height:2.5rem; border-radius:.9rem; color:var(--sub); transition:background .2s,color .2s,transform .2s; flex:none; }
  .btn-icon:hover{ background:var(--s3); color:var(--fg); }
  .btn-icon:disabled{ opacity:.3; pointer-events:none; }
  .btn-icon:active{ transform:scale(.94); }
  .btn{ display:inline-flex; align-items:center; gap:.5rem; height:2.5rem; padding:0 1rem; border-radius:.9rem; background:var(--s2); border:1px solid var(--line); font-size:.875rem; font-weight:500; transition:background .2s,border-color .2s; white-space:nowrap; }
  .btn:hover{ background:var(--s3); border-color:var(--s4); }
  .btn-acc{ background:var(--acc); color:var(--acc-ink); border-color:transparent; }
  .btn-acc:hover{ background:#ececec; }
  .circle{ width:2.75rem; height:2.75rem; border-radius:999px; display:grid; place-items:center; background:rgba(32,32,32,.88); border:1px solid var(--s4); color:var(--fg); backdrop-filter:blur(10px); transition:background .2s,color .2s,transform .2s,opacity .2s; flex:none; }
  .circle:hover{ background:var(--acc); color:var(--acc-ink); }
  .circle:active{ transform:scale(.94); }
  .circle:disabled{ opacity:.3; pointer-events:none; }
  .circle.sm{ width:2.25rem; height:2.25rem; }
  .circle.sm .ic{ width:1.1rem; height:1.1rem; }

  /* Header */
  .logo{ width:2.5rem; height:2.5rem; border-radius:.8rem; border:1px solid var(--s4); background:var(--s2); display:grid; place-items:center; color:var(--acc); transition:transform .3s; }
  #logoBtn:hover .logo{ transform:rotate(-6deg) scale(1.05); }

  /* Animations */
  @keyframes rise{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
  .rise{ animation:rise .45s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(var(--i,0) * 30ms); }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

  /* Device cards */
  .dcard{ position:relative; border-radius:1.75rem; background:var(--s2); border:1px solid var(--line); padding:1.5rem; min-height:16rem; display:flex; flex-direction:column; text-align:left; transition:transform .25s,border-color .25s,background .25s; cursor:pointer; overflow:hidden; }
  .dcard:hover{ transform:translateY(-3px); border-color:var(--mute); background:var(--s3); }
  .dcard[data-off="true"]{ opacity:.5; }
  .dicon{ width:4.5rem; height:4.5rem; border-radius:1.3rem; background:var(--s1); border:1px solid var(--line); display:grid; place-items:center; color:var(--acc); }
  .dicon .ic{ width:2.25rem; height:2.25rem; stroke-width:1.4; }
  .bar{ height:6px; border-radius:99px; background:var(--s4); overflow:hidden; }
  .bar>i{ display:block; height:100%; background:var(--acc); border-radius:inherit; transition:width .9s cubic-bezier(.2,.7,.2,1); }
  .tile-link{ display:flex; align-items:center; gap:1rem; padding:1.1rem 1.25rem; border-radius:1.4rem; background:var(--s1); border:1px dashed var(--s4); text-align:left; width:100%; transition:background .2s,border-color .2s; }
  .tile-link:hover{ background:var(--s2); border-color:var(--mute); }
  .tile-link .ti{ width:2.75rem; height:2.75rem; border-radius:.9rem; background:var(--s2); border:1px solid var(--line); display:grid; place-items:center; color:var(--acc); flex:none; }
  .tile-solid{ border-style:solid; border-color:var(--line); }

  /* Panels */
  .panel-wrap{ position:relative; flex:none; display:flex; }
  .panel{ width:17rem; overflow:hidden; background:var(--s1); border-right:1px solid var(--line); transition:width .3s cubic-bezier(.4,0,.2,1); }
  .panel[data-collapsed="true"]{ width:0; border-right-width:0; }
  .panel-inner{ width:17rem; height:100%; overflow-y:auto; padding:1rem .75rem; }
  .panel-tab{ position:absolute; z-index:15; left:100%; top:50%; translate:0 -50%; width:18px; height:56px; border-radius:0 12px 12px 0; background:var(--s2); border:1px solid var(--line); border-left:0; color:var(--sub); display:grid; place-items:center; transition:background .2s,color .2s; }
  .panel-tab:hover{ background:var(--acc); color:var(--acc-ink); }
  .panel-tab .ic{ width:14px; height:14px; transition:transform .3s; }
  .panel-wrap[data-collapsed="true"] .panel-tab .ic{ transform:rotate(180deg); }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; padding:.25rem .75rem .75rem; font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--mute); font-weight:600; }
  @media (max-width:767px){
    .panel-wrap{ flex-direction:column; }
    .panel{ width:100%; max-height:13rem; border-right:0; border-bottom:1px solid var(--line); transition:max-height .3s cubic-bezier(.4,0,.2,1); overflow-y:auto; }
    .panel[data-collapsed="true"]{ width:100%; max-height:0; border-bottom-width:0; }
    .panel-inner{ width:100%; height:auto; overflow:visible; }
    .panel-tab{ position:static; translate:none; width:100%; height:22px; border-radius:0; border:0; border-bottom:1px solid var(--line); background:var(--s1); }
    .panel-tab .ic{ transform:rotate(90deg); }
    .panel-wrap[data-collapsed="true"] .panel-tab .ic{ transform:rotate(-90deg); }
  }

  .row{ display:flex; align-items:center; gap:.75rem; width:100%; padding:.6rem .7rem; border-radius:1rem; border:1px solid transparent; text-align:left; color:var(--sub); transition:background .2s,color .2s,border-color .2s; }
  .row:hover{ background:var(--s2); color:var(--fg); }
  .row[aria-current="true"]{ background:var(--s3); border-color:var(--s4); color:var(--fg); }
  .row[data-off="true"]{ opacity:.45; }
  .row .ri{ width:2.5rem; height:2.5rem; border-radius:.8rem; background:var(--s1); border:1px solid var(--line); display:grid; place-items:center; flex:none; color:var(--acc); }
  .row .bar{ height:4px; margin-top:.4rem; }

  /* Content */
  .seg{ display:flex; padding:.2rem; gap:.15rem; background:var(--s1); border:1px solid var(--line); border-radius:.9rem; }
  .seg button{ width:2.1rem; height:2rem; border-radius:.65rem; font-size:.75rem; font-weight:600; color:var(--mute); transition:.2s; }
  .seg button:hover{ color:var(--fg); }
  .seg button[aria-pressed="true"]{ background:var(--s4); color:var(--fg); }
  .search{ display:flex; align-items:center; gap:.5rem; height:2.5rem; padding:0 .8rem; background:var(--s1); border:1px solid var(--line); border-radius:.9rem; color:var(--mute); min-width:0; transition:border-color .2s,background .2s; }
  .search:focus-within{ border-color:var(--mute); background:var(--s2); color:var(--fg); }
  .search input{ background:transparent; border:0; outline:0; width:9rem; font-size:.875rem; color:var(--fg); }
  .search input::placeholder{ color:var(--mute); }
  .sel{ display:inline-flex; align-items:center; gap:.5rem; height:2.5rem; padding:0 .8rem; background:var(--s1); border:1px solid var(--line); border-radius:.9rem; font-size:.875rem; color:var(--fg); transition:background .2s,border-color .2s; white-space:nowrap; }
  .sel:hover,.sel[aria-expanded="true"]{ background:var(--s2); border-color:var(--mute); }
  .sel:focus-visible{ outline:2px solid var(--acc); }

  #grid{ display:grid; gap:1rem; grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr)); }
  .fcard{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.9rem; padding:1.75rem 1rem 1.4rem; border-radius:1.6rem; background:var(--s2); border:1px solid var(--line); cursor:pointer; transition:transform .25s,border-color .25s,background .25s; text-align:center; min-height:calc(var(--tile) * .95); }
  .fcard:hover{ transform:translateY(-3px); background:var(--s3); border-color:var(--mute); }
  .fcard .fi{ width:3.5rem; height:3.5rem; display:grid; place-items:center; color:var(--acc); }
  .fcard .fi .ic{ width:3.25rem; height:3.25rem; stroke-width:1.25; }
  .pcard{ position:relative; border-radius:1.4rem; background:var(--s2); border:1px solid var(--line); padding:.5rem; cursor:pointer; transition:transform .25s,border-color .25s,background .25s; }
  .pcard:hover{ transform:translateY(-3px); background:var(--s3); border-color:var(--mute); }
  .pimg{ position:relative; aspect-ratio:4/3; border-radius:1rem; overflow:hidden; background:var(--s1); }
  .pimg img{ width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .4s,transform .5s; display:block; }
  .pimg img.in{ opacity:1; }
  .pcard:hover .pimg img{ transform:scale(1.05); }
  .pcap{ position:absolute; inset:auto 0 0 0; padding:1.5rem .7rem .55rem; background:linear-gradient(to top,rgba(0,0,0,.75),transparent); font-size:.75rem; color:#eee; opacity:0; transition:opacity .25s; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pcard:hover .pcap,.pcard:focus-visible .pcap{ opacity:1; }
  .pheart{ position:absolute; top:.5rem; right:.5rem; width:2rem; height:2rem; display:grid; place-items:center; border-radius:99px; background:rgba(20,20,20,.7); color:var(--fg); opacity:0; transition:opacity .2s,background .2s,color .2s; backdrop-filter:blur(6px); }
  .pheart .ic{ width:1rem; height:1rem; }
  .pcard:hover .pheart,.pheart.on{ opacity:1; }
  .pheart:hover{ background:var(--acc); color:var(--acc-ink); }
  .pheart.on .ic,.fav-on .ic{ fill:currentColor; }
  @media (hover:none){ .pcap{ opacity:1; } .pheart{ opacity:1; } }

  /* Popover, drawer, modal, toast */
  .pop{ position:fixed; z-index:90; min-width:13rem; padding:.4rem; background:var(--s2); border:1px solid var(--s4); border-radius:1.1rem; box-shadow:0 20px 50px rgba(0,0,0,.55); animation:pop .16s ease-out both; transform-origin:top right; }
  @keyframes pop{ from{ opacity:0; transform:scale(.95) translateY(-4px); } to{ opacity:1; transform:none; } }
  .pop button{ display:flex; align-items:center; gap:.75rem; width:100%; padding:.6rem .75rem; border-radius:.75rem; font-size:.875rem; color:var(--sub); text-align:left; }
  .pop button:hover{ background:var(--s3); color:var(--fg); }
  .pop button[aria-current="true"]{ background:var(--s3); color:var(--fg); }
  .pop hr{ border:0; border-top:1px solid var(--line); margin:.35rem .25rem; }
  #sugg{ position:fixed; z-index:90; padding:.35rem; background:var(--s2); border:1px solid var(--s4); border-radius:1.1rem; box-shadow:0 20px 50px rgba(0,0,0,.55); max-height:min(22rem,60dvh); overflow-y:auto; overscroll-behavior:contain; }
  #sugg[hidden]{ display:none; }
  #sugg .sg{ display:flex; align-items:center; gap:.7rem; width:100%; padding:.55rem .7rem; border-radius:.75rem; font-size:.875rem; color:var(--sub); text-align:left; cursor:pointer; }
  #sugg .sg .th{ width:2.25rem; height:2.25rem; flex:none; object-fit:cover; border-radius:.55rem; background:var(--s3); }
  #sugg .sg .mt{ max-width:40%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #sugg .sg .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #sugg .sg .mt{ flex:none; font-size:.72rem; color:var(--mute); }
  #sugg .sg mark{ background:transparent; color:var(--fg); font-weight:600; }
  #sugg .sg[aria-selected="true"], #sugg .sg:hover{ background:var(--s3); color:var(--fg); }
  #scrim{ position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.55); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .3s; }
  #scrim[data-open="true"]{ opacity:1; pointer-events:auto; }
  #drawer{ position:fixed; top:0; right:0; bottom:0; width:min(22rem,92vw); z-index:70; background:var(--s1); border-left:1px solid var(--line); transform:translateX(100%); transition:transform .32s cubic-bezier(.4,0,.2,1),visibility 0s linear .32s; display:flex; flex-direction:column; visibility:hidden; }
  #drawer[data-open="true"]{ transform:none; visibility:visible; transition:transform .32s cubic-bezier(.4,0,.2,1),visibility 0s; }
  .mlabel{ padding:1.1rem 1.25rem .5rem; font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:var(--mute); font-weight:600; }
  .mitem{ display:flex; align-items:center; gap:.9rem; width:calc(100% - 1rem); margin:0 .5rem; padding:.7rem .75rem; border-radius:.9rem; color:var(--sub); font-size:.9rem; transition:.2s; text-align:left; }
  .mitem:hover{ background:var(--s3); color:var(--fg); }
  .mitem[aria-current="true"]{ background:var(--s3); color:var(--fg); }
  .badge{ font-size:.7rem; font-weight:600; padding:.1rem .5rem; border-radius:99px; background:var(--s4); color:var(--fg); }
  kbd{ font-family:inherit; font-size:.7rem; padding:.1rem .4rem; border-radius:.4rem; background:var(--s3); border:1px solid var(--s4); color:var(--fg); }
  #modal{ position:fixed; inset:0; z-index:95; display:grid; place-items:center; padding:1rem; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); animation:fadeIn .2s both; }
  #modal .card.mini{ width:min(22rem,100%); padding:1.25rem; }
  .scrow{ display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.55rem .25rem; border-top:1px solid var(--line); font-size:.85rem; color:var(--sub); }
  .scrow span:first-child{ display:flex; gap:.3rem; flex:none; }
  #modal .card{ width:min(26rem,100%); background:var(--s2); border:1px solid var(--s4); border-radius:1.6rem; padding:1.5rem; animation:rise .3s both; }
  #toast{ position:fixed; left:50%; bottom:1.5rem; z-index:100; transform:translate(-50%,20px); opacity:0; background:var(--s2); color:var(--fg); border:1px solid var(--s4); box-shadow:0 12px 32px rgba(0,0,0,.5); padding:.65rem 1.1rem; border-radius:99px; font-size:.85rem; font-weight:500; transition:.3s; pointer-events:none; max-width:90vw; }
  #toast.show{ transform:translate(-50%,0); opacity:1; }

  /* Viewer */
  #viewer{ position:fixed; inset:0; z-index:40; background:#0f0f0f; display:flex; flex-direction:column; animation:fadeIn .25s both; }

<script>
(() => {
'use strict';

/* ============================== Helpers ============================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ic = (n, c = '') => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmtBytes = b => { if (b < 1024) return b + ' B'; const u = ['KB','MB','GB','TB']; let i = -1; do { b /= 1024; i++; } while (b >= 1024 && i < 3); return b.toFixed(b >= 100 ? 0 : b >= 10 ? 1 : 2) + ' ' + u[i]; };

}
function focusInitial() {

/* ---- viewer helpers ---- */

/* ---- directional navigation ---- */
function dpad(dir) {

  const r0 = (cur || cards[0]).getBoundingClientRect(), cx = r0.left + r0.width / 2, cy = r0.top + r0.height / 2;

function goBack() {

  if (route.view === 'device') { pendingFocus = `[data-dev="${route.deviceId}"]`; go('#/'); return true; }

function okKey() {
  const sc = activeScope(), a = document.activeElement;

}

  const card = document.activeElement.closest ? document.activeElement.closest('[data-photo]') : null; if (!card) return false;
  const idx = $$('.pcard', els.grid).indexOf(card);
  toggleFav(card.dataset.photo);
  if (route.view === 'fav') { const cs = $$('.pcard', els.grid); focusEl(cs[Math.min(idx, cs.length - 1)] || $('[data-href="#/"]', els.crumbs)); }
  return true;
}
function handleAct(act, e) {

    case 'ok': return okKey();
    case 'back': return goBack();
    case 'menu': if (modalEl || pop) return goBack(); if (drawerOpen) closeDrawer(); else openDrawer(); return true;

    }

    case 'yellow': if (inV && V.open) { rotate(); return true; } if (inApp) { const sz = [130, 180, 250]; tile = sz[(sz.indexOf(tile) + 1) % 3]; store.set('tile', tile); renderGrid(false); toast(['Small', 'Medium', 'Large'][sz.indexOf(tile)] + ' tiles'); return true; } return false;
    case 'blue': if (inV && V.open) { toggleInfo(); return true; } if (inApp) { els.q.focus(); return true; } return false;

let hintKey = '';

  else if (sc.type === 'viewer' && V.s > 1.001) h = [H(dp, 'Pan'), H(K('OK'), 'Fit'), H(K('CH±'), 'Photo'), H(C('r'), 'Favorite'), H(C('y'), 'Rotate'), H(K('BACK'), 'Fit')];
